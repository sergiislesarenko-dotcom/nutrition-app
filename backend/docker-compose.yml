version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: nutrition_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nutrition_db
      MYSQL_USER: nutrition_user
      MYSQL_PASSWORD: nutrition_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db_test:
    image: mysql:8.0
    container_name: nutrition_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nutrition_test_db
      MYSQL_USER: nutrition_user
      MYSQL_PASSWORD: nutrition_pass
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrition_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://nutrition_user:nutrition_pass@db:3306/nutrition_db
      SECRET_KEY: ${SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
